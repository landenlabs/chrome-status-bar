<html>
<head>
  <meta charset="utf-8">
  <title>Page Status Bar options</title>
  <style>
    body { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 16px; min-width: 260px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; }
    label { display: block; margin: 4px 0; }
    footer { margin-top: 12px; color: #666; font-size: 11px; }
    footer a { color: #36c; }
    #saved { color: #2a7; margin-left: 8px; visibility: hidden; }
  </style>
</head>
<body>
  <fieldset>
    <legend>Status bar position <span id="saved">Saved</span></legend>
    <label><input type="radio" name="position" value="top"> Top of the page</label>
    <label><input type="radio" name="position" value="bottom"> Bottom of the page</label>
  </fieldset>
  <footer>
    Copyright LanDen Labs - Dennis Lang 2026<br>
    <a href="https://github.com/landenlabs/chrome-status-bar" target="_blank" rel="noopener">Source on GitHub</a> ·
    <a href="https://landenlabs.com" target="_blank" rel="noopener">landenlabs.com</a>
  </footer>
  <script src="options.js"></script>
</body>
</html>
